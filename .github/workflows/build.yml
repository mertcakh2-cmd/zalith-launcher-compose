name: Zalith Launcher - APK Builder

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zalith-apk-build
  cancel-in-progress: true

jobs:
  build:
    name: Compile Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"
          yes | sdkmanager --licenses

      - name: Make Gradle Executable
        run: chmod +x ./gradlew

      - name: Verify Gradle
        run: ./gradlew --version

      - name: Clean Project
        run: ./gradlew clean

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Zalith-Launcher-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Build Report
        if: success()
        run: |
          echo "## Zalith Launcher Build Successful!" >> $GITHUB_STEP_SUMMARY
          echo "APK compiled successfully." >> $GITHUB_STEP_SUMMARY
          echo "Package: com.zalith.launcher" >> $GITHUB_STEP_SUMMARY
          echo "Gradle: 8.7" >> $GITHUB_STEP_SUMMARY
          echo "Java: 17" >> $GITHUB_STEP_SUMMARY
