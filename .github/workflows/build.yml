name: Zalith Launcher APK Builder

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zalith-build
  cancel-in-progress: true

jobs:
  build:
    name: Build Zalith APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"
          yes | sdkmanager --licenses

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: |
          gradle :app:assembleDebug --stacktrace

      - name: Upload Zalith APK
        uses: actions/upload-artifact@v4
        with:
          name: Zalith-Launcher-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Build Summary
        if: success()
        run: |
          echo "## Zalith Launcher Build Successful!" >> $GITHUB_STEP_SUMMARY
          echo "APK generated successfully." >> $GITHUB_STEP_SUMMARY
          echo "Package: com.zalith.launcher" >> $GITHUB_STEP_SUMMARY
