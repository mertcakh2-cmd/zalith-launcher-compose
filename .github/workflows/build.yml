
name: Zalith Launcher APK Builder

on: [push, workflow_dispatch]

permissions:
  contents: read

jobs:
  build:
    name: Build Zalith APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # IMPORTANT: Installs sdkmanager and adds it to PATH
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK 35
        run: |
          sdkmanager --install "platforms;android-35"
          sdkmanager --install "build-tools;35.0.0"
          sdkmanager --install "platform-tools"

      - name: Verify Android SDK
        run: |
          sdkmanager --version
          adb version

      - name: Prepare Gradle
        run: chmod +x ./gradlew

      - name: Verify Gradle
        run: ./gradlew --version

      - name: Clean Project
        run: ./gradlew clean

      - name: Build Zalith APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Zalith-Launcher-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
